<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overflow-escape fixture: the same strip, cards positioned</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
  section { padding: 4rem 1.5rem; min-height: 60vh; }
  /* The positioned ancestor sits ABOVE the scroll strip, so it is the containing
     block of every absolute box inside the cards. */
  .wrap { position: relative; }
  .strip { overflow-x: auto; }
  .track { display: grid; grid-auto-flow: column; grid-auto-columns: 40%; gap: 20px; margin: 0; padding: 0; list-style: none; }
  .card { position: relative; min-height: 200px; background: #eee; padding: 1rem; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<section>
  <div class="wrap">
    <div class="strip">
      <ul class="track">
        <li class="card"><a href="#">More<span class="sr"> about one</span></a></li>
        <li class="card"><a href="#">More<span class="sr"> about two</span></a></li>
        <li class="card"><a href="#">More<span class="sr"> about three</span></a></li>
        <li class="card"><a href="#">More<span class="sr"> about four</span></a></li>
        <li class="card"><a href="#">More<span class="sr"> about five</span></a></li>
      </ul>
    </div>
  </div>
</section>
</body>
</html>
