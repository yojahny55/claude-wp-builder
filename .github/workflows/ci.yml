# Stage 1 of automated CI: run what already exists on every pull request.
#
# Until now the only committed workflow was the OCR review bot, so nothing mechanical
# stood between a broken contract and main -- CLAUDE.md said so outright ("There is no
# CI. Run the checks yourself before claiming a change works"), and that sentence was
# load-bearing on everyone remembering to.
#
# Stage 2 has started: the `integration` job below provisions a real WordPress with a
# pinned Polylang and SCF and runs the ACF translation path logic inside it. That job
# earned its place on its first run, by finding a defect the pure checks structurally
# could not -- ACF resolves a field name through a hidden reference meta, so the field
# definition is unavailable on a post with no value, which is every brand-new translation
# counterpart.
#
# Still NOT here: the broken-site corpus with expected audit findings, and browser
# artifacts for failed functional scenarios. Both build on the fixture the integration job
# now provides; neither is bolted on early, because a half one would make the green light
# mean less than it does now.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # php and node are both preinstalled on ubuntu-latest, and the checks need both:
      # roughly a dozen shell out to `node` (the wp-config and craft families) and a
      # dozen more to `php`. Versions are whatever the image ships on purpose -- these
      # assert prose contracts, not runtime behaviour, so pinning here would buy
      # nothing. The syntax job below is where a version is the whole point.
      - name: Tool versions
        run: |
          bash --version | head -1
          node --version
          php --version | head -1

      # Every check runs, then the job reports. Exiting on the first red would hand back
      # one defect per round trip -- a PR that broke three contracts would take three
      # pushes to discover it broke three contracts.
      - name: Run every contract check
        run: |
          set -uo pipefail
          pass=0; failed=(); skipped=()
          # Three checks are owned by their own jobs, which give them the WordPress and
          # the browser they need. Running them here too would execute them a second time per
          # CI run -- and worse, this job has neither, so each would take its skip path,
          # exit 0 and be counted as a pass. A runner that lost Chrome would then still
          # turn this job green, which is exactly the silent-skip failure their own jobs
          # exist to refuse: the guard would be in place and standing next to an open door.
          # visual-baselines.sh joins them for the same reason and one of its own: it
          # renders inside a pinned container, and running it here would pull a 3.5 GB
          # image a second time per CI run. baseline-approval.sh needs the PR's base
          # branch, which this job does not fetch, so it lives in doc-sync below where the
          # base is already there -- here it would take its own skip path and pass while
          # checking nothing.
          skip_here='tests/checks/motion-devices.sh tests/checks/wp-polylang-integration.sh tests/checks/wp-cf7-delivery.sh tests/checks/visual-baselines.sh tests/checks/baseline-approval.sh'
          for f in tests/checks/*.sh; do
            case " $skip_here " in *" $f "*) continue ;; esac
            if out=$(bash "$f" 2>&1); then
              # Exit 0 is not the same fact as "this check measured something". Three
              # checks here take a skip path when an optional dependency is absent --
              # wp-polylang-live.sh without PLL_TEST_SITE, craft-kit-sync.sh without the
              # kit, wp-library.sh without the MCP corpus -- and each printed SKIP, exited
              # 0, and was counted in PASS. The aggregate then read as full coverage while
              # some of it had not run. They are legitimately optional, so this does not
              # fail the job; it separates the count, so "118 passed" cannot quietly mean
              # 115 passed and 3 declined.
              if printf '%s' "$out" | grep -q 'SKIP'; then
                skipped+=("$f")
              else
                pass=$((pass + 1))
              fi
            else
              failed+=("$f")
              printf '::group::FAIL %s\n' "$f"
              printf '%s\n' "$out" | tail -30
              printf '::endgroup::\n'
              printf '::error file=%s::%s failed\n' "$f" "$f"
            fi
          done
          printf '\nPASS=%d SKIP=%d FAIL=%d\n' "$pass" "${#skipped[@]}" "${#failed[@]}"
          if [ "${#skipped[@]}" -gt 0 ]; then
            printf 'skipped checks (optional dependency absent, NOT counted as passing):\n'
            printf '  %s\n' "${skipped[@]}"
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'failing checks:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: node --check every ES module
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            node --check "$f"
            n=$((n + 1))
          done < <(find bin -name '*.mjs' -not -path '*/node_modules/*')
          printf 'ok: %d ES module(s) parse\n' "$n"

      # The runner's default PHP is 8.x, and `php -l` under 8.x happily accepts `match`,
      # union types and nullsafe calls -- every one of which is a fatal parse error on
      # 7.4. Linting at the default would therefore be green and wrong, which is worse
      # than not linting: it reads as proof.
      #
      # skills/wp-polylang/scripts/*.php run via `wp eval-file` inside whatever
      # WordPress the client has, and CLAUDE.md puts them on a 7.4 floor. The starters
      # get copied into user projects and only __cinematic__ declares a floor of its own
      # ("Requires PHP: 8.0" in its style.css), so everything else is held to 7.4 too.
      # Nothing in the tree uses 8.0-only syntax today, so this starts green; the point
      # is that adding some fails here, making a raised floor a deliberate act instead
      # of a silent one.
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: php -l at the 7.4 floor
        run: |
          set -euo pipefail
          php --version | head -1
          n=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null
            n=$((n + 1))
          done < <(find . -name '*.php' -not -path './node_modules/*' -not -path './starter-theme/__cinematic__/*')
          printf 'ok: %d file(s) parse on 7.4\n' "$n"

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      - name: php -l the cinematic starter at its declared 8.0 floor
        run: |
          set -euo pipefail
          php --version | head -1
          n=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null
            n=$((n + 1))
          done < <(find starter-theme/__cinematic__ -name '*.php')
          printf 'ok: %d file(s) parse on 8.0\n' "$n"

  doc-sync:
    name: Docs describe the plugin that exists
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on a pull request: the CHANGELOG rule compares the branch against its base,
    # and a push to main has no base to compare against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # bin/doc-sync-check.sh has shipped for months without anything running it --
      # tests/checks/wp-contributing.sh only asserts that /wp-contribute *mentions* it.
      # This is the first thing that executes it, and so the first thing that can catch
      # a command added to the README table but never created, or a PR with no CHANGELOG
      # entry, without a human remembering to look.
      - name: Fetch the base ref
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Run the doc-sync gate
        run: bash bin/doc-sync-check.sh --changelog-base "origin/${{ github.base_ref }}"

      # Same job because it needs the same thing: the base ref, to see which commits the
      # branch adds. I06 requires that baseline images change only through an explicit
      # review step, and this is that step -- a commit touching tests/baselines/ must say
      # "baseline: <why>" in its subject. It cannot run in the checks job, which has no
      # base to diff against and would pass by skipping.
      - name: Baseline images changed only through the review step
        run: bash tests/checks/baseline-approval.sh "origin/${{ github.base_ref }}"

  integration:
    name: WordPress integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real database, as a service container rather than a container this job starts:
    # the provisioner takes its connection details from the environment precisely so the
    # same script serves a developer's docker and this, without branching on which.
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wp-fixture
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      # --fail, and no pipe on the verification. Without --fail, curl writes the server's
      # 404 page to the output path and exits 0, so /usr/local/bin/wp becomes a text file
      # that happens to be executable -- which is what happened the first time this job
      # ran, reporting "404:: command not found" three steps later from inside the
      # provisioner. And `wp --info | head -3` cannot fail the step at all, because the
      # pipeline's status is head's: the check that was supposed to catch a broken binary
      # was structurally incapable of it.
      #
      # Versioned phars are published as GitHub release assets. The builds repo's phar/
      # directory carries wp-cli.phar (latest) and nothing version-suffixed, so the
      # obvious-looking pinned URL there is always a 404.
      - name: Install WP-CLI
        run: |
          curl -sSL --fail -o /usr/local/bin/wp \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          chmod +x /usr/local/bin/wp
          wp --info --allow-root

      # This job reaches the network on purpose, and it is the only one that does: a
      # WordPress fixture cannot exist without downloading a WordPress. Everything it
      # installs is pinned in the provisioner, and every assertion runs against the local
      # install -- nothing here asserts against a remote service.
      # Two checks, each provisioning its own fixture. They run in one step because the
      # runner's default shell is `bash -e` -- confirmed in the job log, `shell:
      # /usr/bin/bash -e {0}` -- so a failing check aborts the step and the second never
      # starts. No explicit guard is needed between them, and the note is here because the
      # absence of one reads like an oversight.
      - name: WordPress fixture checks
        env:
          WP_FIXTURE: "1"
          WP_FIXTURE_DB_HOST: 127.0.0.1:3307
          WP_FIXTURE_DB_USER: root
          WP_FIXTURE_DB_PASS: wp-fixture
        run: |
          echo "::group::polylang translation path"
          bash tests/checks/wp-polylang-integration.sh
          echo "::endgroup::"
          echo "::group::contact form delivery"
          bash tests/checks/wp-cf7-delivery.sh
          echo "::endgroup::"

  browser:
    name: Browser devices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # playwright-core only -- not `playwright`, and no browser download. The runner
      # already ships Chrome, and a job that downloads a browser on every run is slower
      # and fails differently on a cold cache than the thing it is meant to be testing.
      # No package-lock.json, so no npm ci: the single dependency is pinned to an exact
      # version in package.json, which is what a lockfile would add here and nothing more.
      - name: Install playwright-core
        run: npm install --no-audit --no-fund

      # Once, not twice. MOTION_REQUIRE_BROWSER turns the check's own skip path into a
      # failure, so a runner that loses Chrome fails here instead of going green -- which
      # a second invocation inspecting the first one's output also achieved, at the cost
      # of a second browser launch and a second chance to flake.
      - name: motion.js devices in a real browser
        env:
          # The runner's own Chrome. The driver falls back through the usual paths, but
          # naming it here means a runner image change surfaces as "no usable Chrome"
          # from the driver rather than as a mystery skip.
          CHROME_PATH: /usr/bin/google-chrome
          MOTION_REQUIRE_BROWSER: "1"
        run: |
          echo "::group::motion devices"
          bash tests/checks/motion-devices.sh
          echo "::endgroup::"

  visual:
    name: Visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pixelmatch and pngjs do the comparing; playwright-core is what runs inside the
      # container. All of them are pinned to exact versions in package.json.
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      # The renderer is pinned and the check pulls it itself, rather than this job using
      # `container:`. Two reasons: the check has to work the same way on a developer
      # machine as it does here, and it is the check -- not the workflow -- that knows
      # which image the committed baselines were rendered by. RENDERED-BY.txt beside the
      # PNGs is that record, and the check refuses to compare against a different one.
      #
      # Deliberately NOT the runner's own Chrome, which is what motion-devices.sh uses.
      # That check asserts on the DOM, which survives a browser upgrade; this one asserts
      # on pixels, which do not. ubuntu-latest ships a self-updating Chrome and migrates
      # to Ubuntu 26 in October, so baselines taken against it would fail every time
      # Chrome shipped a font or antialiasing change -- "the baseline moved" would mean
      # "Chrome moved" more often than it meant a regression, and a gate that cries wolf
      # is a gate people mute.
      - name: Pull the pinned renderer
        run: docker pull mcr.microsoft.com/playwright:v1.63.0-noble

      # VISUAL_REQUIRE_BROWSER turns the check's own skip path into a failure: a runner
      # without docker fails here instead of reporting a green tick for a check that
      # rendered nothing.
      - name: Compare rendered motion fixtures to approved baselines
        env:
          VISUAL_REQUIRE_BROWSER: "1"
        run: |
          echo "::group::visual baselines"
          bash tests/checks/visual-baselines.sh
          echo "::endgroup::"

      # The diff images are the whole point of a failed visual run: the percentage tells a
      # reviewer that something moved, and only the picture tells them what.
      - name: Upload diffs when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: tests/baselines/.failed-diffs/
          if-no-files-found: ignore
