# OpenCodeReview PR review — adapted from upstream
# examples/github_actions/ocr-review.yml (fetched 2026-09-16) for this fleet:
#   * runs-on: self-hosted (AI rig runner) — ubuntu-latest cannot reach LiteLLM
#   * llm_url secret: Alibaba token plan (qwen3.8-max) since 2026-09-24; was LiteLLM :4000 (composite action runs on the rig
#     HOST, not in a container, so 192.168.0.20 works — not 172.17.0.1)
#   * llm_extra_body '{"enable_thinking":false}' — upstream default sends Anthropic-shaped
#     {"thinking":{"type":"disabled"}}, an unknown field on an OpenAI-compatible endpoint;
#     Qwen's own switch is enable_thinking (see the input below for the measurements)
#   * review_concurrency 2 + llm_timeout 600 — single-GPU local 27B, not cloud
#
# Secrets/vars (already set): OCR_LLM_URL, OCR_LLM_AUTH_TOKEN (Alibaba token-plan
# key), vars OCR_LLM_MODEL=qwen3.8-max, OCR_LLM_USE_ANTHROPIC=false
#
# The sole review bot since 2026-09-16 (PR-Agent was retired after the trial).
name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target so fork PRs get secrets; the action only reads the diff
  # and never executes PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: self-hosted
    timeout-minutes: 60
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // For issue_comment events, resolve PR base/head so the action
            // can review the right diff (issue_comment has no top-level
            // pull_request payload fields).
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # Thinking off. The Alibaba token plan enables it by default for qwen3.8-max (the old
          # LiteLLM `coder` route disabled it server-side, so '{}' used to be enough): a probe
          # measured 26.5s / 918 tokens (787 reasoning) with it on vs 5.7s / 214 tokens off,
          # and the first reviews on it ran 30+ min against ~9 on the local model.
          llm_extra_body: '{"enable_thinking":false}'
          llm_timeout: '600'
          review_concurrency: '2'
          stream_progress: 'true'
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
