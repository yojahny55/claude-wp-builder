# OpenCodeReview PR review — adapted from upstream
# examples/github_actions/ocr-review.yml (fetched 2026-09-16) for this fleet:
#   * runs-on: self-hosted (AI rig runner). Needed while the endpoint was LiteLLM on the rig's
#     LAN; since 2026-09-24 the endpoint is the public Alibaba token plan (qwen3.8-max), so
#     ubuntu-latest would also work. Kept on the rig for now, a single runner: reviews queue.
#   * llm_extra_body from vars.OCR_LLM_EXTRA_BODY, default '{"enable_thinking":false}'. That is
#     Qwen3's switch, and the token plan turns thinking on by default (a probe measured 26.5 s
#     / 918 tokens on vs 5.7 s / 214 off). It is coupled to the model, and the "Model and
#     extra body agree" step enforces that: it fails the run before the review when the
#     effective body is not JSON, or carries enable_thinking while OCR_LLM_MODEL does not
#     contain "qwen3". Repointing the model to a non-Qwen3 one therefore means setting
#     OCR_LLM_EXTRA_BODY to '{}', which is how to say "send no extra body". Clearing the
#     variable does NOT say that: an empty variable is indistinguishable from an unset one in
#     an expression, so the default applies (and the guard then names both variables).
#     Upstream's default, Anthropic-shaped {"thinking":{"type":"disabled"}}, is not used on an
#     OpenAI-compatible endpoint.
#   * The action is pinned to a commit SHA, not @main: this runs on pull_request_target with
#     the paid LLM key and pull-requests: write, so an upstream push must not run here until
#     someone bumps the pin deliberately.
#   * review_concurrency 2 + llm_timeout 600 were sized for the single-GPU local 27B. The cloud
#     endpoint could take more; not retuned yet.
#
# Secrets/vars (already set): OCR_LLM_URL, OCR_LLM_AUTH_TOKEN (Alibaba token-plan
# key), vars OCR_LLM_MODEL=qwen3.8-max, OCR_LLM_USE_ANTHROPIC=false, optional OCR_LLM_EXTRA_BODY
#
# The sole review bot since 2026-09-16 (PR-Agent was retired after the trial).
name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target so fork PRs get secrets; the action only reads the diff
  # and never executes PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: self-hosted
    timeout-minutes: 60
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // For issue_comment events, resolve PR base/head so the action
            // can review the right diff (issue_comment has no top-level
            // pull_request payload fields).
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      # The default body lives here only; the review reads the checked value from this step.
      - name: Model and extra body agree
        id: extra-body
        uses: actions/github-script@v7
        env:
          MODEL: ${{ vars.OCR_LLM_MODEL }}
          # Thinking off by default; see the header for the measurements and the model coupling.
          EXTRA_BODY: ${{ vars.OCR_LLM_EXTRA_BODY || '{"enable_thinking":false}' }}
        with:
          script: |
            const model = process.env.MODEL || '';
            const raw = process.env.EXTRA_BODY;
            let body;
            try {
              body = JSON.parse(raw);
            } catch (err) {
              core.setFailed(`OCR_LLM_EXTRA_BODY is not valid JSON (${err.message}); use '{}' to send no extra body.`);
              return;
            }
            if (body && typeof body === 'object' && 'enable_thinking' in body && !/qwen3/i.test(model)) {
              core.setFailed(`the effective OCR_LLM_EXTRA_BODY carries enable_thinking (Qwen3's switch) but OCR_LLM_MODEL is '${model}', not a Qwen3 model: set OCR_LLM_EXTRA_BODY to '{}' or repoint OCR_LLM_MODEL.`);
              return;
            }
            core.setOutput('body', raw);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@486022daaf14f7142275eddb9b3cacc3cc5dadfa # main as of 2026-09-25
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          llm_extra_body: ${{ steps.extra-body.outputs.body }}
          llm_timeout: '600'
          review_concurrency: '2'
          stream_progress: 'true'
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
