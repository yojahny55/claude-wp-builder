<!-- ============ SECTION: Process ============ -->
<section id="process" class="process-rail" data-motion="pan" data-motion-span="2.0">
  <div class="process-rail__frame">
    <ol class="process-rail__rail" data-motion-rail>
      <li class="process-rail__intro">
        <p class="process-rail__kicker">{{kicker}}</p>
        <h2 class="process-rail__title">{{title}}</h2>
        <p class="process-rail__lede">{{lede}}</p>
      </li>
      <li class="process-rail__step">
        <span class="process-rail__n">{{step_1_n}}</span>
        <h3 class="process-rail__step-title">{{step_1_title}}</h3>
        <p class="process-rail__step-body">{{step_1_body}}</p>
      </li>
      <li class="process-rail__step">
        <span class="process-rail__n">{{step_2_n}}</span>
        <h3 class="process-rail__step-title">{{step_2_title}}</h3>
        <p class="process-rail__step-body">{{step_2_body}}</p>
      </li>
      <li class="process-rail__step">
        <span class="process-rail__n">{{step_3_n}}</span>
        <h3 class="process-rail__step-title">{{step_3_title}}</h3>
        <p class="process-rail__step-body">{{step_3_body}}</p>
      </li>
      <li class="process-rail__step">
        <span class="process-rail__n">{{step_4_n}}</span>
        <h3 class="process-rail__step-title">{{step_4_title}}</h3>
        <p class="process-rail__step-body">{{step_4_body}}</p>
      </li>
    </ol>
  </div>
</section>
<!-- ============ END SECTION: Process ============ -->
