<!-- ============ SECTION: Closing ============ -->
<section id="closing" class="closing-block" data-motion="reveal" data-motion-stagger="70">
  <div class="closing-block__frame">
    <div class="closing-block__inner">
      <p class="closing-block__kicker">{{kicker}}</p>
      <h2 class="closing-block__title" data-motion-cue="0 1 0 0">{{title}}</h2>
      <p class="closing-block__lede">{{lede}}</p>
      <p class="closing-block__actions">
        <a class="closing-block__cta" href="{{cta_href}}">{{cta_label}}</a>
      </p>
      <p class="closing-block__aside">{{aside}}</p>
    </div>
  </div>
</section>
<!-- ============ END SECTION: Closing ============ -->
