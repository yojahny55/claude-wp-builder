<!-- ============ SECTION: FAQ ============ -->
<section id="faq" class="faq-list" data-motion="reveal" data-motion-stagger="60">
  <header class="faq-list__head">
    <p class="faq-list__kicker">{{kicker}}</p>
    <h2 class="faq-list__title">{{title}}</h2>
    <p class="faq-list__lede">{{lede}}</p>
  </header>
  <div class="faq-list__list">
    <details class="faq-list__item" name="faq-list" open>
      <summary class="faq-list__q">{{q1}}</summary>
      <div class="faq-list__a"><p>{{a1}}</p></div>
    </details>
    <details class="faq-list__item" name="faq-list">
      <summary class="faq-list__q">{{q2}}</summary>
      <div class="faq-list__a"><p>{{a2}}</p></div>
    </details>
    <details class="faq-list__item" name="faq-list">
      <summary class="faq-list__q">{{q3}}</summary>
      <div class="faq-list__a"><p>{{a3}}</p></div>
    </details>
    <details class="faq-list__item" name="faq-list">
      <summary class="faq-list__q">{{q4}}</summary>
      <div class="faq-list__a"><p>{{a4}}</p></div>
    </details>
    <details class="faq-list__item" name="faq-list">
      <summary class="faq-list__q">{{q5}}</summary>
      <div class="faq-list__a"><p>{{a5}}</p></div>
    </details>
  </div>
</section>
<!-- ============ END SECTION: FAQ ============ -->
