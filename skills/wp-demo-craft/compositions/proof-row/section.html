<!-- ============ SECTION: Proof ============ -->
<section id="proof" class="proof-row" data-motion="reveal" data-motion-stagger="80">
  <div class="proof-row__head">
    <p class="proof-row__kicker">{{kicker}}</p>
    <h2 class="proof-row__title">{{title}}</h2>
  </div>
  <ul class="proof-row__figures">
    <li class="proof-row__figure">
      <b class="proof-row__num" data-motion-count="{{n1}}">{{n1}}</b>
      <span class="proof-row__label">{{label1}}</span>
      <span class="proof-row__source">{{source1}}</span>
    </li>
    <li class="proof-row__figure">
      <b class="proof-row__num" data-motion-count="{{n2}}">{{n2}}</b>
      <span class="proof-row__label">{{label2}}</span>
      <span class="proof-row__source">{{source2}}</span>
    </li>
    <li class="proof-row__figure">
      <b class="proof-row__num" data-motion-count="{{n3}}">{{n3}}</b>
      <span class="proof-row__label">{{label3}}</span>
      <span class="proof-row__source">{{source3}}</span>
    </li>
  </ul>
  <div class="proof-row__marquee" role="group" aria-label="{{marquee_label}}">
    <ul class="proof-row__track">
      <li class="proof-row__name">{{name1}}</li>
      <li class="proof-row__name">{{name2}}</li>
      <li class="proof-row__name">{{name3}}</li>
      <li class="proof-row__name">{{name4}}</li>
      <li class="proof-row__name">{{name5}}</li>
      <li class="proof-row__name">{{name6}}</li>
      <li class="proof-row__name" aria-hidden="true">{{name1}}</li>
      <li class="proof-row__name" aria-hidden="true">{{name2}}</li>
      <li class="proof-row__name" aria-hidden="true">{{name3}}</li>
      <li class="proof-row__name" aria-hidden="true">{{name4}}</li>
      <li class="proof-row__name" aria-hidden="true">{{name5}}</li>
      <li class="proof-row__name" aria-hidden="true">{{name6}}</li>
    </ul>
  </div>
</section>
<!-- ============ END SECTION: Proof ============ -->
