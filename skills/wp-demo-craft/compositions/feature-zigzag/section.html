<!-- ============ SECTION: Features ============ -->
<section id="features" class="feature-zigzag" data-motion="reveal" data-motion-stagger="90">
  <header class="feature-zigzag__head">
    <p class="feature-zigzag__kicker">{{kicker}}</p>
    <h2 class="feature-zigzag__title">{{title}}</h2>
  </header>
  <article class="feature-zigzag__item">
    <figure class="feature-zigzag__media">
      <img src="{{feature_1_image_src}}" alt="{{feature_1_image_alt}}" width="1400" height="1050" loading="lazy" decoding="async">
    </figure>
    <div class="feature-zigzag__copy">
      <h3 class="feature-zigzag__heading">{{feature_1_title}}</h3>
      <p class="feature-zigzag__body">{{feature_1_body}}</p>
      <a class="feature-zigzag__link" href="{{feature_1_href}}">{{feature_1_label}}</a>
    </div>
  </article>
  <article class="feature-zigzag__item feature-zigzag__item--flip">
    <figure class="feature-zigzag__media">
      <img src="{{feature_2_image_src}}" alt="{{feature_2_image_alt}}" width="1400" height="1050" loading="lazy" decoding="async">
    </figure>
    <div class="feature-zigzag__copy">
      <h3 class="feature-zigzag__heading">{{feature_2_title}}</h3>
      <p class="feature-zigzag__body">{{feature_2_body}}</p>
      <a class="feature-zigzag__link" href="{{feature_2_href}}">{{feature_2_label}}</a>
    </div>
  </article>
</section>
<!-- ============ END SECTION: Features ============ -->
