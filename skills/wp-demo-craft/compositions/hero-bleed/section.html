<!-- ============ SECTION: Hero ============ -->
<section id="hero" class="hero-bleed">
  <img class="hero-bleed__bed" src="{{image_src}}" alt="{{image_alt}}" width="2400" height="1600"
       data-motion="parallax" data-motion-rate="0.6" fetchpriority="high">
  <div class="hero-bleed__scrim scrim--band" aria-hidden="true"></div>
  <div class="hero-bleed__copy" data-motion="reveal" data-motion-stagger="70">
    <p class="hero-bleed__kicker">{{kicker}}</p>
    <h1 class="hero-bleed__title" data-motion-cue="0 1 0 0">{{title}}</h1>
    <p class="hero-bleed__lede">{{lede}}</p>
    <p class="hero-bleed__actions"><a class="hero-bleed__cta" href="{{cta_href}}">{{cta_label}}</a></p>
  </div>
</section>
<!-- ============ END SECTION: Hero ============ -->
