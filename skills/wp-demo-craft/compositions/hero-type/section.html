<!-- ============ SECTION: Hero ============ -->
<section id="hero" class="hero-type" data-motion="reveal" data-motion-stagger="70">
  <p class="hero-type__kicker">{{kicker}}</p>
  <h1 class="hero-type__title" data-motion-cue="0 1 0 0">{{title}}</h1>
  <p class="hero-type__lede">{{lede}}</p>
  <p class="hero-type__actions"><a class="hero-type__cta" href="{{cta_href}}">{{cta_label}}</a></p>
</section>
<!-- ============ END SECTION: Hero ============ -->
