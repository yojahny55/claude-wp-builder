<!-- ============ SECTION: Score scale (score-scale) ============ -->
<section id="{{section_id}}" class="score-scale">
  <div class="score-scale__head">
    <p class="score-scale__kicker">{{kicker}}</p>
    <h2 class="score-scale__title">{{title}}</h2>
    <p class="score-scale__lede">{{lede}}</p>
  </div>

  <figure class="score-scale__figure">
    <figcaption class="score-scale__caption">{{scale_caption}}</figcaption>

    <div class="score-scale__track" role="img" aria-label="{{scale_alt}}">
      <div class="score-scale__band score-scale__band--poor">
        <span class="score-scale__band-name">Poor</span>
        <span class="score-scale__band-range">300&ndash;579</span>
      </div>
      <div class="score-scale__band score-scale__band--fair">
        <span class="score-scale__band-name">Fair</span>
        <span class="score-scale__band-range">580&ndash;669</span>
      </div>
      <div class="score-scale__band score-scale__band--good">
        <span class="score-scale__band-name">Good</span>
        <span class="score-scale__band-range">670&ndash;739</span>
      </div>
      <div class="score-scale__band score-scale__band--very">
        <span class="score-scale__band-name">Very good</span>
        <span class="score-scale__band-range">740&ndash;799</span>
      </div>
      <div class="score-scale__band score-scale__band--top">
        <span class="score-scale__band-name">Exceptional</span>
        <span class="score-scale__band-range">800&ndash;850</span>
      </div>
      <div class="score-scale__marker" aria-hidden="true"></div>
    </div>

    <ul class="score-scale__factors">
      <li class="score-scale__factor">
        <span class="score-scale__weight">35%</span>
        <span class="score-scale__factor-name">Payment history</span>
      </li>
      <li class="score-scale__factor">
        <span class="score-scale__weight">30%</span>
        <span class="score-scale__factor-name">Amounts owed</span>
      </li>
      <li class="score-scale__factor">
        <span class="score-scale__weight">15%</span>
        <span class="score-scale__factor-name">Length of history</span>
      </li>
      <li class="score-scale__factor">
        <span class="score-scale__weight">10%</span>
        <span class="score-scale__factor-name">Credit mix</span>
      </li>
      <li class="score-scale__factor">
        <span class="score-scale__weight">10%</span>
        <span class="score-scale__factor-name">New credit</span>
      </li>
    </ul>
  </figure>
</section>
<!-- ============ END SECTION: Score scale ============ -->
