<!-- ============ SECTION: Testimonials ============ -->
<section id="testimonials" class="testimonial-pair" data-motion="spotlight">
  <header class="testimonial-pair__head">
    <p class="testimonial-pair__kicker">{{kicker}}</p>
    <h2 class="testimonial-pair__title">{{title}}</h2>
  </header>
  <div class="testimonial-pair__grid" data-motion="reveal" data-motion-stagger="90">
    <blockquote class="testimonial-pair__quote" cite="{{quote_1_cite}}">
      <p class="testimonial-pair__text">{{quote_1}}</p>
      <p class="testimonial-pair__who">
        <span class="testimonial-pair__name">{{name_1}}</span>
        <span class="testimonial-pair__place">{{place_1}}</span>
      </p>
    </blockquote>
    <blockquote class="testimonial-pair__quote" cite="{{quote_2_cite}}">
      <p class="testimonial-pair__text">{{quote_2}}</p>
      <p class="testimonial-pair__who">
        <span class="testimonial-pair__name">{{name_2}}</span>
        <span class="testimonial-pair__place">{{place_2}}</span>
      </p>
    </blockquote>
  </div>
</section>
<!-- ============ END SECTION: Testimonials ============ -->
