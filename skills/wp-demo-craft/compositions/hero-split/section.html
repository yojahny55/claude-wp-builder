<!-- ============ SECTION: Hero ============ -->
<section id="hero" class="hero-split" data-motion="reveal" data-motion-stagger="60">
  <div class="hero-split__copy">
    <p class="hero-split__kicker">{{kicker}}</p>
    <h1 class="hero-split__title" data-motion-cue="0 1 0 0">{{title}}</h1>
    <p class="hero-split__lede">{{lede}}</p>
    <div class="hero-split__actions">
      <a class="hero-split__cta" href="{{cta_href}}">{{cta_label}}</a>
      <a class="hero-split__alt" href="{{alt_href}}">{{alt_label}}</a>
    </div>
  </div>
  <figure class="hero-split__media">
    <img src="{{image_src}}" alt="{{image_alt}}" width="1200" height="1500"
         data-motion="parallax" data-motion-rate="0.35" fetchpriority="high">
  </figure>
</section>
<!-- ============ END SECTION: Hero ============ -->
